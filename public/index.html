<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#CC010A">
<title>Tuye Bites | Fast food delivered in Wote</title>
<meta name="description" content="Order chips, chicken, burgers, pizza and more in Wote town. Pay on M-Pesa Till and we deliver to your door.">
<meta property="og:title" content="Tuye Bites - Fast food delivered in Wote">
<meta property="og:description" content="Order online, pay on M-Pesa Till, we bring it to your door.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://tuye-bites.netlify.app/">
<meta property="og:image" content="https://tuye-bites.netlify.app/share.jpg">

<meta property="og:image:height" content="630">

<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=34">
<script src="api.js?v=12"></script>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
</head>
<body>
<!-- Opening screen of the installed app: the full logo, then "Powered by Muthwii Mukamba" -->
<div id="splash" aria-hidden="true"><img src="/logo-full.webp" alt=""><p>Powered by <b>Muthwii Mukamba</b></p></div>
<script>
(() => {
  const s = document.getElementById("splash");
  // Shown when the site is opened as an installed app (or with ?splash=1 to try it)
  const app = matchMedia("(display-mode: standalone)").matches || navigator.standalone || /[?&]splash=1/.test(location.search);
  if (!app) { s.remove(); return; }
  s.classList.add("on");
  const hide = () => { if (!s.isConnected) return; s.classList.add("gone"); setTimeout(() => s.remove(), 600); };
  addEventListener("load", () => setTimeout(hide, 1600));
  setTimeout(hide, 4000);
})();
</script>

<header class="top">
  <div class="in">
    <a class="brand brand-full" href="./" aria-label="Tuye Bites home">
      <span class="head-logo" id="logo"></span>
    </a>
    <span class="grow"></span>
    <span class="moto-chip" id="motoChip" title="Delivery time"><svg class="moto" viewBox="0 0 70 40" aria-hidden="true">
        <g class="lines" stroke-linecap="round" stroke-width="2.2"><line x1="0" y1="15" x2="10" y2="15" stroke="#CC010A"/><line x1="2" y1="22" x2="11" y2="22" stroke="#E7A545"/><line x1="0" y1="29" x2="9" y2="29" stroke="#72B800"/></g>
        <g class="ride">
          <rect x="13" y="8.6" width="14" height="13" rx="2.4" fill="#E7A545"/><rect x="13" y="13.2" width="14" height="2.8" fill="#CC010A"/><rect x="18.5" y="7" width="3" height="2.4" rx="1" fill="#883A61"/>
          <path d="M12.5 29.5C12.5 23 17 20.5 24 20.5H35.5L33.5 26.5H44C47 26.5 49.5 27.8 50.5 30H14.5Z" fill="#CC010A"/>
          <rect x="22" y="17.2" width="12" height="3.6" rx="1.8" fill="#883A61"/>
          <path d="M47 13.5 53.8 31.5" stroke="#2b1720" stroke-width="2.6" stroke-linecap="round"/><path d="M44.5 12.6H50" stroke="#2b1720" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M47.6 27.2A7.4 7.4 0 0 1 60.5 29.6" fill="none" stroke="#CC010A" stroke-width="2.6" stroke-linecap="round"/><circle cx="51" cy="17.2" r="1.7" fill="#E7A545"/>
          <path d="M31.5 18.5 40 22.2 41 27" fill="none" stroke="#2b1720" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M31.8 18 35.6 10.8" stroke="#189E01" stroke-width="5.6" stroke-linecap="round"/><path d="M35.8 11.6 46 13" stroke="#189E01" stroke-width="2.6" stroke-linecap="round"/>
          <circle cx="37.6" cy="6.4" r="4.3" fill="#CC010A"/><path d="M38.6 5.2H42" stroke="#2b1720" stroke-width="2.2" stroke-linecap="round"/>
        </g>
        <g class="wheel"><circle cx="20" cy="32" r="5.8" fill="#fff" stroke="#2b1720" stroke-width="2.8"/><path d="M20 27.6V36.4M15.6 32H24.4" stroke="#72B800" stroke-width="1.4"/><circle cx="20" cy="32" r="1.5" fill="#E7A545"/></g>
        <g class="wheel"><circle cx="54" cy="32" r="5.8" fill="#fff" stroke="#2b1720" stroke-width="2.8"/><path d="M54 27.6V36.4M49.6 32H58.4" stroke="#72B800" stroke-width="1.4"/><circle cx="54" cy="32" r="1.5" fill="#E7A545"/></g>
      </svg><b id="motoTime">05-15 min</b></span>
    <span class="grow"></span>
    <span class="pill hidden" id="openPill"></span>
    <button class="btn small cart-btn" id="cartBtn" aria-label="Open cart">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.6 12.2a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.5L21.5 8H6.2"/></svg>
      <span class="top-cart-label">Cart</span>
      <span class="count hidden" id="cartCount">0</span>
    </button>
  </div>
</header>
<div class="notice hidden" id="notice"></div>
<div class="closed-bar hidden" id="closedBar"></div>
<div class="busy-bar hidden" id="busyBar"></div>
<button type="button" class="orders-bar hidden" id="ordersBar"></button>

<main class="wrap">
  <section class="hero">
    <div class="hero-text">
      <h1>Hot food from Wote's best fast foods, <span>brought to your door.</span></h1>
      <p>Choose your food, pay on M-Pesa Till and our rider brings it to you. <b id="dTime"></b></p>
      <div class="steps"><span><b>1</b>Pick your food</span><button type="button" class="step-btn" id="tillStep" title="Tap to copy the till number"><b>2</b><i id="tillText">Pay on Till</i><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button><span><b>3</b>We deliver</span></div>
    </div>
    <div class="hero-vis" id="heroVis" aria-label="Featured food"></div>
  </section>

  <section class="deals hidden" id="deals"></section>

  <div class="tools">
    <div class="search"><input type="search" id="search" placeholder="Search food, e.g. chips, chicken, pizza" aria-label="Search food"></div>
    <div class="chips" id="chips"></div>
  </div>

  <div id="menu"><p class="empty">Loading the menu...</p></div>
  <p class="foot-note" id="myOrders"></p>
</main>
<footer class="site-foot" id="siteFoot"></footer>

<div class="install hidden" id="install"></div>
<button class="cartbar hidden" id="cartBar"><span id="cartBarCount"></span><span id="cartBarTotal"></span></button>
<div id="sheets"></div>

<script src="shop.js?v=24"></script>
</body>
</html>
