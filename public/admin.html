<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#CC010A">
<meta name="robots" content="noindex">
<title>Admin | Tuye Bites</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=39">
<link rel="stylesheet" href="admin.css?v=16">
<script src="api.js?v=17"></script>
<script src="receipt.js?v=3"></script>
</head>
<body class="admin">

<header class="top">
  <div class="in">
    <a class="brand brand-full admin-brand" href="#orders" aria-label="Tuye Bites admin">
      <span class="head-logo" id="logo"></span>
      <small id="whoSmall">Admin</small>
    </a>
    <span class="grow"></span>
    <button class="btn small light hidden" id="soundBtn">Sound off</button>
    <a class="btn small line admin-only" href="./" target="_blank">View site</a>
    <button class="btn small light hidden" id="logoutBtn">Log out</button>
  </div>
</header>

<!-- ================= LOGIN / FIRST-TIME SETUP ================= -->
<div class="auth-wrap hidden" id="authView">
  <div class="auth-card">
    <div class="logo" id="authLogo"></div>
    <h2 id="authTitle">Welcome back</h2>
    <p class="sub" id="authSub">Log in with your phone number</p>
    <form class="form" id="authForm" novalidate>
      <label class="hidden" id="codeWrap">Setup code <input type="password" id="aCode" autocomplete="off" placeholder="The SETUP_CODE"></label>
      <p class="hint hidden" id="codeHint"></p>
      <label class="hidden" id="nameWrap">Your name <input id="aName" autocomplete="name" maxlength="40"></label>
      <label id="phoneWrap">Phone number <input id="aPhone" type="tel" inputmode="tel" autocomplete="username" placeholder="07XXXXXXXX"></label>
      <label>Password <input type="password" id="aPass" autocomplete="current-password" placeholder="At least 6 characters"></label>
      <p class="err" id="authErr"></p>
      <button class="btn wide" id="authBtn">Log in</button>
      <p class="hint" style="text-align:center"><button type="button" class="linkbtn" id="forgotBtn">Forgot password? (main admin)</button></p>
    </form>
  </div>
</div>

<!-- ================= LOGGED IN ================= -->
<div class="hidden" id="appView">
  <nav class="nav"><div class="in" id="nav"></div></nav>
  <main class="page" id="page"></main>
</div>
<div id="sheets"></div>

<script src="admin.js?v=26"></script>
</body>
</html>
