<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#CC010A">
<title>Privacy and refunds | Tuye Bites</title>
<meta name="description" content="How Tuye Bites uses your details, and our refund rules.">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css?v=26">
<script src="/api.js?v=9"></script>
</head>
<body>
<header class="top">
  <div class="in">
    <a class="brand brand-full" href="/" aria-label="Tuye Bites home">
      <span class="head-logo" id="logo"></span>
    </a>
    <span class="grow"></span>
    <a class="btn small light" href="/">Back to the menu</a>
  </div>
</header>

<main class="track policy">
  <div class="card">
    <h1>Privacy and refunds</h1>
    <p class="hint">Simple rules so you know what to expect when you order from Tuye Bites.<span id="changed"></span></p>
  </div>

  <div id="policyBody"><p class="empty">Loading...</p></div>

  <a class="btn wa wide" id="waBtn" target="_blank" rel="noopener" href="#">Ask us on WhatsApp</a>
  <p class="hint" style="text-align:center;margin-top:14px">Tuye Bites, Wote town</p>
</main>

<script>
(async () => {
  $("#logo").innerHTML = FULL_LOGO;
  let settings = {};
  try { settings = (await Api.shop()).settings; $("#logo").innerHTML = headerLogo(settings); $("#waBtn").href = waLink(settings.whatsapp, "Hello Tuye Bites, "); } catch (e) {}
  try {
    // The wording the admin saved in Settings (or the original one)
    const p = await Api.policy();
    $("#policyBody").innerHTML = policyHtml(p.text, settings);
    if (p.updatedAt) $("#changed").textContent = " Last changed " + new Date(p.updatedAt).toLocaleDateString("en-KE", { day: "numeric", month: "long", year: "numeric" }) + ".";
  } catch (e) { $("#policyBody").innerHTML = `<div class="card"><p>${esc(e.message)}</p></div>`; }
})();
</script>
</body>
</html>
